image: node:22-bookworm-slim

stages:
  - verify
  - deploy

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "fix/registration-forum-production"'
    - when: never

verify_and_build:
  stage: verify
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run verify
  artifacts:
    expire_in: 1 day
    paths:
      - .svelte-kit/cloudflare/

.deploy_pages:
  stage: deploy
  needs:
    - job: verify_and_build
      artifacts: true
  script:
    - test -n "$CLOUDFLARE_API_TOKEN"
    - test -n "$CLOUDFLARE_ACCOUNT_ID"
    - test -n "$CLOUDFLARE_PAGES_PROJECT"
    - npx wrangler pages deploy .svelte-kit/cloudflare --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch="$CI_COMMIT_REF_NAME" --commit-hash="$CI_COMMIT_SHA" --commit-message="$CI_COMMIT_TITLE"

deploy_preview:
  extends: .deploy_pages
  environment:
    name: preview/fix-registration-forum-production
  rules:
    - if: '$CI_COMMIT_BRANCH == "fix/registration-forum-production"'

deploy_production:
  extends: .deploy_pages
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

